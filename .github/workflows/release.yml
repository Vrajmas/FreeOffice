name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: github.event_name == 'pull_request'
        run: npm run naming:test
      - if: github.event_name == 'pull_request'
        run: npm run naming:check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}

  version:
    needs: naming
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run release:test
      - id: candidate
        run: npm run release:version

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: desktop
            kind: doc
          - os: macos-latest
            platform: desktop
            kind: sheet
          - os: windows-latest
            platform: desktop
            kind: doc
          - os: windows-latest
            platform: desktop
            kind: sheet
          - os: ubuntu-latest
            platform: android
            kind: doc
          - os: ubuntu-latest
            platform: android
            kind: sheet
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
      - if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - name: Set release candidate version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --ignore-scripts
      - name: Build installer
        run: npm run build:${{ matrix.platform }}
        env:
          OFFICE_KIND: ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.kind }}-${{ matrix.os }}
          path: releases/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
